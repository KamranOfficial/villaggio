name = "villaggio"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Serves the frontend (public/) directly from this Worker.
# Cloudflare will serve matching static files automatically and only
# fall through to the Worker code for routes it doesn't recognize
# (e.g. /api/*), so no separate Cloudflare Pages project is needed.
[assets]
directory = "../public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "villaggio-handover-db"
database_id = "9ab60c51-bb3d-41e1-ada7-969287844a88"
